<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Entrar ou cadastrar | SNEAKZONE</title><link rel="stylesheet" href="assets/css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js"></script><script defer src="assets/js/app.js"></script></head><body><header id="header"></header><main class="auth-layout wrap"><section class="auth-art"><span class="eyebrow">BEM-VINDO À SNEAKZONE</span><h1>SEU ESTILO<br>COMEÇA <em>AQUI.</em></h1><p>Entre para acompanhar seus pedidos e aproveitar sua experiência.</p></section><section class="auth-box"><div class="auth-tabs"><button class="tab active" data-tab="login">Entrar</button><button class="tab" data-tab="signup">Criar conta</button></div><form id="login-form"><h2>Acesse sua conta</h2><label>E-mail<input type="email" id="login-email" required autocomplete="email"></label><label>Senha<input type="password" id="login-password" required minlength="6" autocomplete="current-password"></label><button class="btn btn-dark full" type="submit">Entrar ↗</button><p id="login-message" class="form-message"></p></form><form id="signup-form" class="hidden"><h2>Crie seu cadastro</h2><label>Nome completo<input id="signup-name" required autocomplete="name"></label><label>E-mail<input type="email" id="signup-email" required autocomplete="email"></label><label>Senha<input type="password" id="signup-password" required minlength="6" autocomplete="new-password"></label><button class="btn btn-dark full" type="submit">Criar conta ↗</button><p id="signup-message" class="form-message"></p></form></section></main><footer id="footer"></footer></body></html>

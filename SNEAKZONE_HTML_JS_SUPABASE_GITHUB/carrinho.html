<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Carrinho e checkout | SNEAKZONE</title><link rel="stylesheet" href="assets/css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js"></script><script defer src="assets/js/app.js"></script></head><body><header id="header"></header><main class="wrap page-main"><div class="page-title"><span class="eyebrow">SNEAKZONE / SUA SACOLA</span><h1>SEU CARRINHO.</h1></div><div class="checkout-layout"><section><div id="cart-items"></div><a class="text-link" href="produtos.html">← Continuar comprando</a></section><aside class="summary"><h2>Resumo do pedido</h2><div class="summary-line"><span>Subtotal</span><strong id="subtotal">R$ 0,00</strong></div><div class="cep-row"><label for="cep">Calcular frete pelo CEP</label><div><input id="cep" inputmode="numeric" maxlength="9" placeholder="00000-000"><button id="calc-shipping" class="btn btn-outline">Calcular</button></div><small id="cep-result" class="muted">Frete estimado para fins acadêmicos.</small></div><div class="summary-line"><span>Frete estimado</span><strong id="shipping">R$ 0,00</strong></div><div class="summary-line total"><span>Total</span><strong id="total">R$ 0,00</strong></div><form id="checkout-form"><label>Endereço de entrega<input id="address" required placeholder="Rua, número, bairro, cidade"></label><label>Forma de pagamento<select id="payment"><option value="Pix (simulação)">Pix (simulação)</option><option value="Cartão (simulação)">Cartão (simulação)</option><option value="Boleto (simulação)">Boleto (simulação)</option></select></label><button class="btn btn-dark full" type="submit">Finalizar pedido ↗</button><p id="checkout-message" class="form-message"></p><small class="muted">Checkout demonstrativo: nenhum pagamento real é processado.</small></form></aside></div></main><footer id="footer"></footer></body></html>
